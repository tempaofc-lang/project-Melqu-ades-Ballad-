name: Publish Mirror archive

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '设定集/联邦大事年纪.md'
      - '梅尔基亚德斯的歌谣_主稿.md'
      - '封面.png'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/**'
      - '设定集/联邦大事年纪.md'
      - '梅尔基亚德斯的歌谣_主稿.md'
      - '封面.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build archive
        run: python scripts/build_site.py
      - name: Check chronology parser
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Prepare browser checks
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check chronology interactions
        run: python scripts/check_chronology_browser.py
      - name: Save interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronology-ui
          path: artifacts/*.png
          retention-days: 7
      - name: Check chapter output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('dist')
          manifest = json.loads((root / 'data/manifest.json').read_text(encoding='utf-8'))
          assert len(manifest['chapters']) == 30
          assert all((root / item['file']).is_file() for item in manifest['chapters'])
          assert (root / 'assets/cover.png').is_file()
          records = json.loads((root / 'data/chronology.json').read_text(encoding='utf-8'))['records']
          assert records and all(item['summary'] and item['paragraphs'] for item in records)
          years = [item['year'] for item in records]
          assert years == sorted(set(years))
          PY
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
